name = "mj-developers-api"
main = "worker/src/index.js"
compatibility_date = "2024-10-01"
workers_dev = true

# ⬇️ YE NAYA SECTION ADD KARO — Worker ko static files serve karne ke liye
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"
IMAGE_HOST = "imgbb"
SITE_URL = "https://mj-developers.someshsoftwareengineer-233.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "mj_dev"
database_id = "2d818aeb-a745-4e6a-8546-b756d57e183d"

# Secrets (set with `wrangler secret put`):
#   ADMIN_JWT_SECRET
#   IMGBB_API_KEY
